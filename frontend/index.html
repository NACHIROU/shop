<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone Shop Bénin - Gestion de boutique</title>
  <meta name="description"
    content="Tableau de bord de gestion pour boutiques iPhone au Bénin. Gérez vos produits, ventes, collaborateurs et livraisons." />
  <meta name="author" content="iPhone Shop Bénin" />

  <meta property="og:title" content="iPhone Shop Bénin - Gestion de boutique" />
  <meta property="og:description" content="Tableau de bord de gestion pour boutiques iPhone au Bénin." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@Lovable" />
  <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0284c7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ShopManager" />

  <style>
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #0284c7;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
      margin-bottom: 20px;
    }

    .app-name {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #0284c7;
      letter-spacing: -0.025em;
    }

    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .splash-fade-out {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>

<body>
  <div id="splash-screen">
    <div class="loader"></div>
    <div class="app-name">EasyManaging</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>

</html>
